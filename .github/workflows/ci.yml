name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  drain:
    name: drain (deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/drain
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task test
      - run: deno fmt --check
      - run: deno lint

  correlate:
    name: correlate (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/correlate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test

  migrations:
    name: migrations (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run assertions
        run: |
          psql -h localhost -U postgres -d drain_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/0001_logs_table.sql \
            -f supabase/migrations/0002_partition_maintenance.sql \
            -f supabase/migrations/0003_retention_cron.sql \
            -f supabase/tests/migrations_test.sql
