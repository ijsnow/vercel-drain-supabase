name: ci

on:
  push:
    branches: [main]
  pull_request:

# No workflow_dispatch inputs and no ${{ github.event.* }} interpolation
# anywhere below: every run: block is static text, so there is no path for
# untrusted PR/issue content to reach a shell.

jobs:
  drain:
    name: drain (deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check, test, format, lint
        working-directory: supabase/functions/vercel-drain
        run: |
          deno check .
          deno test --allow-read
          deno fmt --check
          deno lint
      # smoke.ts lives at the repo root and imports the function's verify.ts,
      # so it is checked separately from the function's own folder.
      - run: deno check scripts/smoke.ts

  migrations:
    name: migrations (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run assertions
        run: |
          psql -h localhost -U postgres -d drain_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/0001_logs_table.sql \
            -f supabase/migrations/0002_partition_maintenance.sql \
            -f supabase/migrations/0003_retention_cron.sql \
            -f supabase/tests/migrations_test.sql
